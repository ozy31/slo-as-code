name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: 3.16.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install promtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool --version

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Unit tests, rule checks, promtool behaviour tests
        run: make test

      - name: Generated files are valid
        run: |
          make dashboards
          for f in out/dashboards/*.json; do jq empty "$f"; done
